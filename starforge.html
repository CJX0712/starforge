<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1a1d29;--muted:#6b7280;--line:#e2e5ee;--acc:#f59e0b;--blue:#2563eb;--ok:#16a34a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);padding:24px 16px 60px}
.wrap{max-width:1080px;margin:0 auto}
header h1{font-size:24px} header h1 .s{color:var(--acc)}
header p{color:var(--muted);font-size:13.5px;margin-top:6px}
.stats{display:flex;gap:14px;margin:16px 0;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 18px;font-size:13px;color:var(--muted)}
.stat b{display:block;font-size:20px;color:var(--ink)}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
input,select{border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:inherit;background:var(--card);outline:0}
input:focus,select:focus{border-color:var(--blue)}
input[type=search]{flex:1;min-width:200px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer;transition:.15s}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .n{color:var(--muted);font-size:11px;margin-left:4px}
.chip.on .n{color:#bbb}
.row{display:flex;align-items:flex-start;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:8px;transition:.12s}
.row:hover{border-color:var(--blue)}
.rank{min-width:34px;text-align:right;color:var(--muted);font-weight:700;font-size:15px;padding-top:2px}
.main{flex:1;min-width:0}
.main a{color:var(--ink);font-weight:600;text-decoration:none;font-size:15px}
.main a:hover{color:var(--blue)}
.main .d{color:var(--muted);font-size:13px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:12px;color:var(--muted);margin-top:6px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.tag{background:#eef2ff;color:var(--blue);border-radius:4px;padding:1px 7px;font-size:11.5px}
.star-btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px;white-space:nowrap}
.star-btn.on{background:#fffbeb;border-color:var(--acc);color:#b45309}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc)}
.footer{margin-top:22px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
button:hover{border-color:var(--blue);color:var(--blue)}
.foot{margin-top:26px;color:var(--muted);font-size:12.5px;text-align:center}
@media(max-width:600px){.main .d{white-space:normal}.rank{display:none}}
</style>
</head>

<div class="wrap">
<header>

<div class="chips" id="chips"></div>
<div id="list"></div>
<div class="footer">

  <button onclick="clearFav()">清空收藏</button>
</div>
<p class="foot">数据快照 2026-09 · 增长率按线性外推 · 作者 晨星 (Chen Xing) · 零依赖 · 零构建</p>

const MAX = Math.max(...DATA.map(d => d.stars));
let track = null;
let fav = new Set(JSON.parse(localStorage.getItem("starforge_fav") || "[]"));

// 赛道 chips
const tracks = [...new Set(DATA.map(d => d.track))];
const chipsEl = document.getElementById("chips");
const allChip = document.createElement("button");
allChip.className = "chip on"; allChip.textContent = "全部 " + DATA.length;
allChip.onclick = () => { track = null; mark(); render(); };
chipsEl.appendChild(allChip);
for (const t of tracks) {
  const b = document.createElement("button");
  b.className = "chip";
  b.innerHTML = t + ' <span class="n">' + DATA.filter(d => d.track === t).length + "</span>";
  b.onclick = () => { track = (track === t ? null : t); mark(); render(); };
  b.dataset.t = t; chipsEl.appendChild(b);
}
function mark() {
  [...chipsEl.children].forEach(c => c.classList.toggle("on", track ? c.dataset.t === track : c === allChip));
}

const nf = n => n.toLocaleString("en-US");
function render() {
  const q = document.getElementById("q").value.toLowerCase();
  const sort = document.getElementById("sort").value;
  const favOnly = document.getElementById("favOnly").value === "1";
  let rows = DATA.filter(d =>
    (!track || d.track === track) &&
    (!favOnly || fav.has(d.full)) &&
    (!q || d.full.toLowerCase().includes(q) || d.desc.toLowerCase().includes(q) || d.lang.toLowerCase().includes(q)));
  rows.sort((a, b) => sort === "name" ? a.full.localeCompare(b.full) : b[sort] - a[sort]);
  document.getElementById("list").innerHTML = rows.map(d => {
    const f = fav.has(d.full);
    return '<div class="row">' +
      '<div class="rank">' + (DATA.indexOf(d) + 1) + "</div>" +
      '<div class="main"><a href="' + d.url + '" target="_blank" rel="noopener">' + d.full + "</a>" +
      '<div class="d">' + (d.desc || "（无描述）") + "</div>" +
      '<div class="meta"><span class="tag">' + d.track + '</span><span>' + d.lang + "</span><span>⭐ " + nf(d.stars) + "</span><span>⑂ " + nf(d.forks) + "</span>" +
      (d.topic.length ? d.topic.map(t => '<span>#' + t + "</span>").join("") : "") + "</div>" +
      '<div class="bar"><i style="width:' + (d.stars / MAX * 100).toFixed(1) + '%"></i></div></div>' +
      '<button class="star-btn' + (f ? " on" : "") + '" data-f="' + d.full + '">' + (f ? "★ 已收藏" : "☆ 收藏") + "</button></div>";
  }).join("") || '<p style="color:var(--muted);padding:30px;text-align:center">没有匹配的仓库</p>';
  document.getElementById("favN").textContent = fav.size;
  [...document.querySelectorAll(".star-btn")].forEach(b => b.onclick = () => {
    const k = b.dataset.f;
    fav.has(k) ? fav.delete(k) : fav.add(k);
    localStorage.setItem("starforge_fav", JSON.stringify([...fav]));
    render();
  });
}
document.getElementById("q").oninput = render;
document.getElementById("sort").onchange = render;
document.getElementById("favOnly").onchange = render;
function download(name, text, mime) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type: mime}));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
function exportJSON() {
  const items = DATA.filter(d => fav.has(d.full)).map(({full, stars, url, track}) => ({repo: full, stars, url, track}));
  download("starforge-favorites.json", JSON.stringify(items, null, 2), "application/json");
}
function exportCSV() {
  const lines = ["repo,stars,track,url"];
  DATA.filter(d => fav.has(d.full)).forEach(d =>
    lines.push('"' + d.full + '",' + d.stars + ',"' + d.track + '",' + d.url));
  download("starforge-favorites.csv", lines.join("\n"), "text/csv");
}
function clearFav() { fav = new Set(); localStorage.setItem("starforge_fav", "[]"); render(); }

// 自检：数据完整性不变量
(function selfTest() {
  const names = DATA.map(d => d.full);
  const dup = names.length !== new Set(names).size;
  const bad = DATA.some(d => !d.full || d.stars < 8000 || !d.url.startsWith("https://github.com/"));
  const tracks = new Set(DATA.map(d => d.track)).size;
  console.log((dup || bad || tracks !== 10) ? "selfTest FAIL" : "selfTest: " + names.length + " repos, 10 tracks, no dup, min-stars ok — ALL GREEN");
})();
render();
</script>
</body>
